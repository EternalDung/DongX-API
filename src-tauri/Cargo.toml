[package]
name = "dongx"
version = "1.6.0"
description = "DongX - Local LLM API Gateway"
authors = ["Wei"]
edition = "2021"

[lib]
name = "dongx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]

# ============================================================
# Tauri 框架 + 插件
# ============================================================
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"            # 打开外部链接/文件
tauri-plugin-store = "2"             # 轻量 KV 存储（窗口状态、首次启动标志等）
tauri-plugin-clipboard-manager = "2" # 复制密钥到剪贴板
tauri-plugin-notification = "2"      # 桌面通知（渠道异常、配额告警）
tauri-plugin-autostart = "2"         # 开机自启
tauri-plugin-dialog = "2"            # 文件选择对话框（导出日志等）
tauri-plugin-updater = "2"           # 应用自动更新：拉 latest.json + ed25519 签名校验
tauri-plugin-process = "2"           # 更新完成后通过 relaunch() 重启应用

# ============================================================
# Web 框架（数据面 — Axum HTTP 代理服务器）
# ============================================================
axum = "0.8"
tower = { version = "0.5", features = ["util"] } # ServiceExt::oneshot 用于 router 测试
tower-http = { version = "0.6", features = ["cors", "trace"] }

# ============================================================
# 异步运行时
# ============================================================
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"                 # SSE 流式响应（proxy → client）

# ============================================================
# HTTP 客户端（转发请求到上游 LLM 供应商）
# ============================================================
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "gzip", "deflate", "brotli"] }
futures-util = "0.3"                 # StreamExt（bytes_stream 转 SSE）
bytes = "1"

# ============================================================
# 数据库（SQLite — 内嵌，无需独立部署）
# ============================================================
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "sqlite",
    "chrono",
    "json",
    "macros",                        # query! / query_as! 编译期 SQL 校验
] }

# ============================================================
# 序列化
# ============================================================
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ============================================================
# 加密（AES-256-GCM 加密供应商密钥 + 系统密钥环）
# ============================================================
aes-gcm = "0.10"
sha2 = "0.10"                       # 安全审计证据哈希（取证链去重/串联）
keyring = { version = "3", features = ["windows-native"] }
rand = "0.8"                         # nonce 生成（与 aes-gcm 0.10 的 rand 0.8 对齐）
base64 = "0.22"                      # 密文 Base64 编码存储

# ============================================================
# RAG 代码解析（类型感知分块：AST 符号感知）
# ============================================================
tree-sitter = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"

# ============================================================
# 工具
# ============================================================
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"                           # 系统目录（app_data_dir / config_dir）
toml_edit = "0.22"                  # Codex config.toml 合并写入（保留其它 provider）
regex = "1"                          # 安全扫描（敏感信息脱敏）
anyhow = "1"                         # 第三方错误兜底（AppError::From<anyhow::Error>）
thiserror = "2"                      # AppError derive 宏
async-trait = "0.1"                  # adapter trait 需要 dyn Adaptor（原生 async fn in trait 不支持 trait 对象）

# ============================================================
# 日志（tracing 生态，不引入 log crate）
# ============================================================
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ============================================================
# TS 契约生成（ts-rs）
# ------------------------------------------------------------
# 类型始终带 derive(TS)（纯编译期，无运行时开销）；导出动作由
# `ts-export` feature 门控：cargo test --features ts-export
# ============================================================
ts-rs = "10"

[features]
# 仅用于门控导出测试：cargo test --features ts-export
ts-export = []
