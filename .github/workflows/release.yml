name: Release

# 触发：打 v* tag 自动跑；也可在 Actions 页手动 Run workflow（workflow_dispatch）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # 需要写权限才能创建 Release 并上传产物

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Tauri 2 在 Linux 上需要一套系统库（gtk/webview/ssl 等）
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Rust cache   # 缓存依赖，二次构建从 15min 降到 2-3min
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend deps
        run: npm install

      # tauri-action 自动跑 cargo tauri build + 前端 npm run build，
      # 并把 bundle/ 下的安装包上传到同 tag 的 Release。
      # 注意：当前未配置代码签名，产物均“未签名”。
      - name: Build & release (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # 内置，无需自建
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'DongX ${{ github.ref_name }}'
          releaseBody: 'Prebuilt installers. Windows may show SmartScreen — click "Run anyway". macOS is unsigned — first run `xattr -cr /Applications/DongX.app` then open from Finder. Linux: use .AppImage or .deb.'
          releaseDraft: false    # 构建完成后自动公开发布，无需手动 Publish
          prerelease: false
